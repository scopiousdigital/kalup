name: release
on:
  push:
    branches: [main]
permissions:
  contents: read
# One release run at a time, never cancelled: a cancelled publish can leave one package out.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # The CI checks, run here on this exact commit, because publishing may not rely on another workflow's run. The Node 24
  # job keeps the tarballs its installed-package checks tested, on Node 24 and on the engines floor, from the one build
  # in that job; those are the files published.
  checks:
    name: checks (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      # The engines floor, read from the manifest as in ci.yml.
      - name: Read the engines floor
        if: matrix.node == 24
        run: echo "NODE_FLOOR=$(node -p "require('./packages/cli/package.json').engines.node.replace('>=', '')")" >> "$GITHUB_ENV"
      - name: Install the engines floor
        if: matrix.node == 24
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_FLOOR }}
      - name: Keep the floor's node for the installed-package check
        if: matrix.node == 24
        run: echo "FLOOR_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check
      - run: pnpm test
      - run: node scripts/pack-smoke.mjs --out tarballs
      - name: Installed packages on the engines floor
        if: matrix.node == 24
        run: node scripts/pack-smoke.mjs --node "$FLOOR_NODE"
      - if: matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: tarballs
          path: tarballs/
          if-no-files-found: error

  # With changesets pending, open or update the version PR. Nothing is published from this job.
  version:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pending: ${{ steps.changesets.outputs.hasChangesets }}
      unpublished: ${{ steps.registry.outputs.unpublished }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: changesets
        uses: changesets/action@v2
        with:
          version: pnpm version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Whether a version is missing from npm, so that a push with nothing to release never waits for an approval.
      - id: registry
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          for dir in packages/core packages/cli; do
            spec=$(node -p "const p = require('./$dir/package.json'); p.name + '@' + p.version")
            npm view "$spec" version > /dev/null 2>&1 || echo "unpublished=true" >> "$GITHUB_OUTPUT"
          done

  # The live journeys against the authorized HubSpot developer test account, only when a publish is due: a release
  # never goes out on the simulator alone. The same steps as live.yml, which stays for runs started by hand; both hold
  # the `live` concurrency group, so two runs never overlap on the portal. The key and portal ID go only to the steps
  # that use them, never to checkout, setup, install or build.
  live:
    needs: [checks, version]
    if: needs.version.outputs.pending == 'false' && needs.version.outputs.unpublished == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: live
      cancel-in-progress: false
    steps:
      - name: Check the secrets are set
        env:
          KALUP_LIVE_KEY: ${{ secrets.KALUP_LIVE_KEY }}
          KALUP_LIVE_PORTAL: ${{ secrets.KALUP_LIVE_PORTAL }}
        run: |
          test -n "$KALUP_LIVE_KEY" || { echo "Set the KALUP_LIVE_KEY secret: a release needs the live journeys"; exit 1; }
          test -n "$KALUP_LIVE_PORTAL" || { echo "Set the KALUP_LIVE_PORTAL secret: a release needs the live journeys"; exit 1; }
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=kalup --output-logs=errors-only
      - run: pnpm --filter kalup test:live
        env:
          KALUP_LIVE_KEY: ${{ secrets.KALUP_LIVE_KEY }}
          KALUP_LIVE_PORTAL: ${{ secrets.KALUP_LIVE_PORTAL }}
      - name: Clean up what the manifests name
        if: always()
        env:
          KALUP_LIVE_KEY: ${{ secrets.KALUP_LIVE_KEY }}
          KALUP_LIVE_PORTAL: ${{ secrets.KALUP_LIVE_PORTAL }}
        run: pnpm test:live:cleanup
      - name: Upload the run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-runs-release
          path: live-runs/
          if-no-files-found: ignore
          retention-days: 30

  # Publishes the checked tarballs' files with changeset publish, which tags the release. The npm environment lets a
  # maintainer require an approval; npm trusted publishing (OIDC) authenticates, so the workflow holds no npm token.
  # It needs the live job, so a failed journey blocks the release.
  publish:
    needs: [checks, version, live]
    if: needs.version.outputs.pending == 'false' && needs.version.outputs.unpublished == 'true' && needs.live.result == 'success'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: tarballs
          path: checked
      # Nothing is built here. dist comes from the checked tarballs, and pnpm must pack exactly the files they hold,
      # so the publish below sends what the checks tested.
      - name: Restore dist from the checked tarballs
        run: |
          core=$(node -p "require('./packages/core/package.json').version")
          cli=$(node -p "require('./packages/cli/package.json').version")
          tar -xzf "checked/kalup-core-$core.tgz" -C packages/core --strip-components=1 package/dist
          tar -xzf "checked/kalup-$cli.tgz" -C packages/cli --strip-components=1 package/dist
      - name: Confirm pnpm packs the checked files
        run: |
          mkdir repacked
          (cd packages/core && pnpm pack --pack-destination ../../repacked)
          (cd packages/cli && pnpm pack --pack-destination ../../repacked)
          for tarball in checked/*.tgz; do
            name=$(basename "$tarball" .tgz)
            mkdir -p "unpacked/checked/$name" "unpacked/repacked/$name"
            tar -xzf "$tarball" -C "unpacked/checked/$name"
            tar -xzf "repacked/$name.tgz" -C "unpacked/repacked/$name"
          done
          diff -r unpacked/checked unpacked/repacked
      - uses: changesets/action@v2
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # changeset publish runs pnpm publish, which reads pnpm_config_*; npm reads npm_config_*.
          NPM_CONFIG_PROVENANCE: 'true'
          PNPM_CONFIG_PROVENANCE: 'true'
